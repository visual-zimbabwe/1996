<!-- Carousel Interaction Script -->
<script>
    const gallery = document.getElementById('gallery-container');
    const cards = document.querySelectorAll('.gallery-card');
    const dots = document.querySelectorAll('#pagination span');
    const counter = document.getElementById('counter');
    const noResults = document.getElementById('no-results');

    function updateActiveState() {
      const scrollLeft = gallery.scrollLeft;
      const cardWidth = cards[0].offsetWidth + 28; // card width + gap
      const activeIndex = Math.round(scrollLeft / cardWidth);

      dots.forEach((dot, idx) => {
        if (idx === activeIndex) {
          dot.className = 'w-1.5 h-1.5 rounded-full bg-neutral-800 transition-all duration-300';
        } else {
          dot.className = 'w-1.5 h-1.5 rounded-full bg-neutral-300 transition-all duration-300';
        }
      });

      if (counter && activeIndex < cards.length) {
        counter.textContent = `${activeIndex + 1} / ${cards.length}`;
      }
    }

    gallery.addEventListener('scroll', () => {
      window.requestAnimationFrame(updateActiveState);
    }, { passive: true });

    function scrollPrev() {
      const cardWidth = cards[0].offsetWidth + 28;
      gallery.scrollBy({ left: -cardWidth, behavior: 'smooth' });
    }

    function scrollNext() {
      const cardWidth = cards[0].offsetWidth + 28;
      gallery.scrollBy({ left: cardWidth, behavior: 'smooth' });
    }

    function filterCovers(query) {
      const q = query.trim().toLowerCase();
      let matchCount = 0;

      cards.forEach(card => {
        const titleData = card.getAttribute('data-title') || '';
        if (!q || titleData.includes(q)) {
          card.style.display = 'flex';
          matchCount++;
        } else {
          card.style.display = 'none';
        }
      });

      if (matchCount === 0) {
        gallery.classList.add('hidden');
        noResults.classList.remove('hidden');
        document.getElementById('pagination').classList.add('hidden');
      } else {
        gallery.classList.remove('hidden');
        noResults.classList.add('hidden');
        document.getElementById('pagination').classList.remove('hidden');
      }
    }
  </script>
